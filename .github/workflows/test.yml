name: Discord bot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: discord-bot-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -B -W error::ResourceWarning -m unittest discover -s scripts/deploy -p 'test_*.py'
      - run: python3 -B scripts/deploy/package.py . "$GITHUB_SHA" bot.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: discord-bot
          path: bot.tar.gz
  deploy:
    if: github.repository == 'OpenRotMG/Open-RotMG-Discord-Bot' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: discord-bot
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: openrotmg-20261011
          workload_identity_provider: ${{ vars.BOT_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BOT_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Rehearse saved data, restart only the bot, and verify readiness
        env:
          DEPLOY_KEY: ${{ secrets.BOT_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.BOT_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/bot-key"
          hosts="$RUNNER_TEMP/bot-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o HostKeyAlias=openrotmg-bot -o ConnectTimeout=60 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o 'ProxyCommand=gcloud compute start-iap-tunnel openrotmg 22 --listen-on-stdin --zone=us-central1-a --project=openrotmg-20261011 --quiet' \
            openrotmg-bot-deploy@openrotmg "$GITHUB_SHA" < bot.tar.gz
